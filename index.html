<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auditflow | Professional Invoice Extractor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';
    </script>
    <style>
        :root {
            --primary: #a78bfa;
            --primary-hover: #c4b5fd;
            --bg: #030712;
            --surface: rgba(17, 24, 39, 0.7);
            --text: #f9fafb;
            --text-dim: #9ca3af;
            --border: rgba(255, 255, 255, 0.08);
            --glass: rgba(255, 255, 255, 0.03);
            --success: #34d399;
            --error: #f87171;
            --accent: #f472b6;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 0% 0%, rgba(167, 139, 250, 0.12) 0%, transparent 50%),
                radial-gradient(circle at 100% 100%, rgba(244, 114, 182, 0.08) 0%, transparent 50%);
        }

        /* Subtle Background Animation */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            opacity: 0.02;
            pointer-events: none;
            z-index: 1;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 3rem 2rem;
            position: relative;
            z-index: 2;
        }

        /* Navbar */
        nav {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 5rem;
            animation: slideDown 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo {
            font-size: 1.75rem;
            font-weight: 700;
            background: linear-gradient(135deg, #fff 0%, var(--primary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .logo::before {
            content: '';
            width: 32px;
            height: 32px;
            background: var(--primary);
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(167, 139, 250, 0.4);
            display: inline-block;
        }

        /* Hero Section */
        .hero {
            text-align: center;
            margin-bottom: 4rem;
            animation: fadeIn 1s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        h1 {
            font-size: 4rem;
            margin-bottom: 0.75rem;
            font-weight: 700;
            letter-spacing: -2px;
            line-height: 1.1;
        }

        .subtitle {
            color: var(--text-dim);
            font-size: 1.25rem;
            margin-bottom: 3rem;
            font-weight: 300;
        }

        .upload-area {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 32px;
            padding: 5rem 2rem;
            cursor: pointer;
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            backdrop-filter: blur(24px);
            max-width: 700px;
            margin: 0 auto;
            position: relative;
            box-shadow: 0 4px 64px rgba(0,0,0,0.4);
        }

        .upload-area:hover {
            border-color: var(--primary);
            background: rgba(167, 139, 250, 0.04);
            transform: scale(1.02);
            box-shadow: 0 20px 80px rgba(0,0,0,0.5), 0 0 20px rgba(167, 139, 250, 0.1);
        }

        .upload-icon {
            font-size: 3.5rem;
            margin-bottom: 1.5rem;
            display: block;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* Processing Queue */
        #processing-stats {
            display: none;
            margin-top: 2rem;
            text-align: center;
        }

        #status-text {
            font-size: 0.9rem;
            color: var(--text-dim);
            margin-bottom: 1rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .progress-container {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            height: 4px;
            background: var(--border);
            border-radius: 2px;
            overflow: hidden;
            display: none;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            width: 0%;
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 20px var(--primary);
        }

        /* Results Table */
        #results-container {
            display: none;
            margin-top: 5rem;
            animation: slideUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card {
            background: var(--surface);
            border-radius: 32px;
            border: 1px solid var(--border);
            padding: 2.5rem;
            backdrop-filter: blur(24px);
            box-shadow: 0 20px 100px rgba(0,0,0,0.6);
        }

        .table-wrapper {
            overflow-x: auto;
            margin-top: 2rem;
            border-radius: 20px;
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--border);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1100px;
        }

        th {
            text-align: left;
            padding: 1.25rem 1rem;
            color: var(--text-dim);
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            border-bottom: 1px solid var(--border);
        }

        td {
            padding: 1rem;
            border-bottom: 1px solid var(--border);
            animation: rowEntrance 0.6s ease-out backwards;
        }

        @keyframes rowEntrance {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }

        input[type="text"] {
            background: transparent;
            border: 1px solid transparent;
            color: var(--text);
            width: 100%;
            padding: 0.5rem;
            border-radius: 8px;
            transition: all 0.3s;
            font-size: 0.95rem;
        }

        input:hover {
            background: rgba(255,255,255,0.02);
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(167, 139, 250, 0.05);
            box-shadow: 0 0 15px rgba(167, 139, 250, 0.1);
        }

        .actions {
            display: flex;
            gap: 1.5rem;
            margin-top: 3rem;
            justify-content: flex-end;
            align-items: center;
        }

        .btn {
            padding: 0.9rem 2rem;
            border-radius: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            border: none;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 0.95rem;
        }

        .btn-primary {
            background: var(--primary);
            color: #000;
            box-shadow: 0 10px 30px rgba(167, 139, 250, 0.3);
        }

        .btn-primary:hover {
            background: var(--primary-hover);
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 15px 40px rgba(167, 139, 250, 0.4);
        }

        .btn-secondary {
            background: var(--glass);
            color: var(--text);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: rgba(255,255,255,0.08);
            transform: translateY(-2px);
        }

        .btn-danger {
            background: transparent;
            color: var(--text-dim);
            padding: 0.5rem;
        }

        .btn-danger:hover {
            color: var(--error);
            background: rgba(248, 113, 113, 0.05);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { height: 8px; width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary); }

        /* Responsive */
        @media (max-width: 768px) {
            h1 { font-size: 2.5rem; }
            .container { padding: 1.5rem; }
            .upload-area { padding: 3rem 1.5rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <nav>
            <div class="logo">Auditflow</div>
        </nav>

        <section class="hero">
            <h1>Invoice Extractor</h1>
            <p class="subtitle">Extract data from multiple bills and organise them</p>
            
            <div class="upload-area" id="drop-zone">
                <span class="upload-icon">✦</span>
                <h3>Drop invoices here</h3>
                <p style="color: var(--text-dim); margin-top: 1rem; font-weight: 300;">Supports PDF, JPEG, PNG</p>
                <input type="file" id="file-input" hidden accept="image/png, image/jpeg, application/pdf" multiple>
            </div>

            <div id="processing-stats">
                <div id="status-text">Analysing documents...</div>
                <div class="progress-container" id="progress-container">
                    <div class="progress-bar" id="progress-bar"></div>
                </div>
            </div>
        </section>

        <section id="results-container">
            <div class="card">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <h2 style="font-weight: 600; letter-spacing: -0.5px;">Extracted Data</h2>
                </div>
                
                <div class="table-wrapper">
                    <table id="bill-table">
                        <thead>
                            <tr>
                                <th>GST NO</th>
                                <th>SELLER</th>
                                <th>BUYER</th>
                                <th>BILL NO</th>
                                <th>DATE</th>
                                <th>AMOUNT</th>
                                <th>RATE</th>
                                <th>CGST</th>
                                <th>SGST</th>
                                <th>TOTAL TAX</th>
                                <th>TOTAL</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody id="table-body">
                            <!-- Rows added here -->
                        </tbody>
                    </table>
                </div>

                <div class="actions">
                    <button class="btn btn-secondary" onclick="addRow()">Add Row</button>
                    <button class="btn btn-primary" onclick="exportToExcel()">
                        <span>Download Spreadsheet</span>
                    </button>
                    <button class="btn btn-danger" style="font-size: 0.8rem; margin-left: 1rem;" onclick="clearResults()">Clear Session</button>
                </div>
            </div>
        </section>
    </div>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const processingStats = document.getElementById('processing-stats');
        const statusText = document.getElementById('status-text');
        const progressBarContainer = document.getElementById('progress-container');
        const progressBar = document.getElementById('progress-bar');
        const resultsContainer = document.getElementById('results-container');
        const tableBody = document.getElementById('table-body');
        
        // Internal Key Handling - Loaded from .env.local
        let API_KEY = '';

        async function loadApiKey() {
            try {
                const response = await fetch('.env.local');
                const text = await response.text();
                const match = text.match(/GROQ_API_KEY=(.*)/);
                if (match && match[1]) {
                    API_KEY = match[1].trim();
                }
            } catch (e) {
                console.warn('Could not load .env.local. Make sure you are running via a local server (e.g. Live Server).');
            }
        }

        window.addEventListener('load', loadApiKey);

        dropZone.onclick = () => fileInput.click();

        dropZone.ondragover = (e) => { e.preventDefault(); dropZone.classList.add('dragover'); };
        dropZone.ondragleave = () => dropZone.classList.remove('dragover');
        dropZone.ondrop = (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            handleFiles(e.dataTransfer.files);
        };

        fileInput.onchange = (e) => handleFiles(e.target.files);

        async function handleFiles(files) {
            const fileList = Array.from(files);
            if (fileList.length === 0) return;

            processingStats.style.display = 'block';
            progressBarContainer.style.display = 'block';
            resultsContainer.style.display = 'block';

            let completed = 0;
            for (const file of fileList) {
                updateStatus(`Analysing ${file.name}...`, (completed / fileList.length) * 100);
                
                try {
                    let imagesToProcess = [];
                    if (file.type === 'application/pdf') {
                        imagesToProcess = await processPdf(file);
                    } else {
                        imagesToProcess = [await fileToBase64(file)];
                    }

                    for (let j = 0; j < imagesToProcess.length; j++) {
                        const extracted = await extractWithGroqVision(imagesToProcess[j], API_KEY);
                        // Add row with a slight delay for pleasant entrance
                        setTimeout(() => addAuditRow(extracted), j * 100);
                    }
                } catch (error) {
                    console.error(error);
                    alert(`Could not process ${file.name}. Please ensure it is a clear image.`);
                }
                
                completed++;
                updateStatus(`Completed ${completed}/${fileList.length}`, (completed / fileList.length) * 100);
            }

            setTimeout(() => {
                progressBarContainer.style.display = 'none';
                statusText.innerText = `Audit Complete`;
            }, 1500);
        }

        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result.split(',')[1]);
                reader.onerror = error => reject(error);
            });
        }

        async function processPdf(file) {
            const arrayBuffer = await file.arrayBuffer();
            const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
            const images = [];

            for (let i = 1; i <= pdf.numPages; i++) {
                const page = await pdf.getPage(i);
                const viewport = page.getViewport({ scale: 2 });
                const canvas = document.createElement('canvas');
                const context = canvas.getContext('2d');
                canvas.height = viewport.height;
                canvas.width = viewport.width;

                await page.render({ canvasContext: context, viewport: viewport }).promise;
                images.push(canvas.toDataURL('image/jpeg', 0.8).split(',')[1]);
            }
            return images;
        }

        async function extractWithGroqVision(base64Image, apiKey) {
            if (!apiKey) {
                alert('API Key not loaded. Please ensure .env.local exists and you are running via a local web server.');
                throw new Error('Missing API Key');
            }
            const prompt = `Extract billing information from this image. Return ONLY a valid JSON object with these keys: gst_no, seller_name, buyer_name, bill_no, date, amount, rate, cgst, sgst, total_tax, total. Identify SELLER as the entity in the header and BUYER as the customer.`;

            const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${apiKey}`
                },
                body: JSON.stringify({
                    model: 'meta-llama/llama-4-scout-17b-16e-instruct',
                    messages: [
                        {
                            role: 'user',
                            content: [
                                { type: 'text', text: prompt },
                                { type: 'image_url', image_url: { url: `data:image/jpeg;base64,${base64Image}` } }
                            ]
                        }
                    ],
                    response_format: { type: 'json_object' },
                    temperature: 0
                })
            });

            if (!response.ok) throw new Error('API Error');
            const data = await response.json();
            return JSON.parse(data.choices[0].message.content);
        }

        function addAuditRow(data) {
            const tr = document.createElement('tr');
            const fields = ['gst_no', 'seller_name', 'buyer_name', 'bill_no', 'date', 'amount', 'rate', 'cgst', 'sgst', 'total_tax', 'total'];
            
            fields.forEach((field, index) => {
                const td = document.createElement('td');
                td.style.animationDelay = `${index * 50}ms`;
                const input = document.createElement('input');
                input.type = 'text';
                input.value = data[field] || '';
                td.appendChild(input);
                tr.appendChild(td);
            });

            const actionTd = document.createElement('td');
            actionTd.innerHTML = `<button class="btn btn-danger" onclick="this.parentElement.parentElement.remove()">×</button>`;
            tr.appendChild(actionTd);

            tableBody.appendChild(tr);
        }

        function addRow() { addAuditRow({}); }

        function clearResults() {
            if (confirm('Clear all session data?')) {
                tableBody.innerHTML = '';
                resultsContainer.style.display = 'none';
                processingStats.style.display = 'none';
            }
        }

        function updateStatus(text, progress) {
            statusText.innerText = text;
            progressBar.style.width = `${progress}%`;
        }

        function exportToExcel() {
            const rows = Array.from(tableBody.querySelectorAll('tr'));
            const data = rows.map(row => {
                const inputs = Array.from(row.querySelectorAll('input'));
                return {
                    'GST NO': inputs[0].value,
                    'SELLER': inputs[1].value,
                    'BUYER': inputs[2].value,
                    'BILL NO': inputs[3].value,
                    'DATE': inputs[4].value,
                    'AMOUNT': inputs[5].value,
                    'RATE': inputs[6].value,
                    'CGST': inputs[7].value,
                    'SGST': inputs[8].value,
                    'TOTAL TAX': inputs[9].value,
                    'TOTAL': inputs[10].value
                };
            });

            const worksheet = XLSX.utils.json_to_sheet(data);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Extraction");
            XLSX.writeFile(workbook, `auditflow_export.xlsx`);
        }
    </script>
</body>
</html>
